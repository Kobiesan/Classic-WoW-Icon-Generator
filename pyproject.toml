[project]
name = "wowicons"
version = "0.2.0"
description = "Build a kohya_ss Stable Diffusion LoRA dataset from WoW .blp icons"
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
wowicons = "wowicons.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wowicons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
